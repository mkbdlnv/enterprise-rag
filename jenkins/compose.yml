services:
  jenkins:
    build: .
    image: rag-jenkins:local
    container_name: jenkins
    restart: unless-stopped
    # Only on localhost: open with `ssh -L 8090:127.0.0.1:8090 <server>`.
    ports:
      - "127.0.0.1:8090:8080"
    # Lets the jenkins user talk to the host Docker daemon (gid written by setup-server.sh).
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets:/run/secrets:ro
    mem_limit: 768m

volumes:
  jenkins_home:
